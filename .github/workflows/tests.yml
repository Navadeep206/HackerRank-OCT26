name: Python tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt pillow-heif
      - name: Run unit tests without live API calls
        env:
          MODEL_PROVIDER: mock
        run: python -m unittest discover -s code/tests -v
      - name: Validate evaluation comparison CLI
        run: python -m code.evaluation.compare_runs --help
      - name: Check dataset and repository contracts
        run: python code/evaluation/dataset_audit.py
