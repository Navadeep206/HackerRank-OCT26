name: Import complete challenge repository

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-source.yml"

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Check out destination repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Copy complete public source repository
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/interviewstreet/hackerrank-orchestrate-june26.git /tmp/original
          rsync -a --delete --exclude='.git/' /tmp/original/ ./
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to import."
            exit 0
          fi
          git commit -m "Import complete original HackerRank Orchestrate repository"
          git push origin HEAD:main
